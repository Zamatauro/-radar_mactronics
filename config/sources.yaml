# Radar Mactronics — Fonti RSS (v1.2)
# Cadenza bisettimanale (lunedì + giovedì mattina).
# 21 fonti, mappate sui 5 filoni narrativi + 4 aree tecnologiche.
#
# ─── REVISIONE v1.2 (30/07/2026) — pulizia per resa ───
# Analisi su 1.497 articoli reali (38 giorni di esercizio): 14 fonti
# consumavano il 49% del budget API senza portare MAI un articolo in email.
# Rimosse. Criteri applicati:
#   • resa zero + volume alto  → via (01net, BitMAT, ComputerWeekly,
#     ZDNet Storage, Punto Informatico, Lineaedp, The Stack, DCK)
#   • duplicato di fonte già presente → via (EnterpriseAI = stesso editore
#     di HPCwire; DataCenter Dynamics = stesso tema di DCK)
#   • fuori perimetro → via (TechCrunch Enterprise = funding/M&A,
#     Wired Italia = consumer, StartupItalia = startup generaliste)
#   • The New Stack: 2 articoli in email su 75 chiamate, tema cloud-native
#     più che HPC/storage → via
# Tenute anche le fonti a bassa resa ma costo trascurabile e tema centrale
# (Blocks & Files, The Next Platform, IEEE Spectrum, WD Blog, ICT4Executive).
#
# ⚠️ Prima di aggiungere una fonte nuova, valutare il VOLUME che pubblica:
# una testata che sforna 30 pezzi/giorno costa ~1$/mese di API anche se
# non porta nulla in email.

sources:

  # ════════════════════════════════════════════════════════════════
  # ITALIANE B2B AUTOREVOLI
  # ════════════════════════════════════════════════════════════════
  # Citate nel Piano Marketing v2 (target backlink, audience CTO/IT Manager IT).
  # Coprono F1 (autorevolezza), F3 (trend italiani), F4 (vendor co-content IT).

  - name: "ICT4Executive"
    feed_url: "https://www.ict4executive.it/feed/"
    tier: 1
    category: "cio_target_it"
    language: "it"
    flow: "fast"
    notes: "Riferimento CIO/IT Manager italiani — DA 65+, citata nel piano. Volume basso, tenuta per valore strategico"

  - name: "ZeroUno"
    feed_url: "https://www.zerounoweb.it/feed/"
    tier: 1
    category: "it_business_it"
    language: "it"
    flow: "fast"
    notes: "Magazine IT enterprise italiano. Miglior score medio tra le italiane (5.9)"

  - name: "CorCom"
    feed_url: "https://www.corrierecomunicazioni.it/feed/"
    tier: 1
    category: "ict_policy_it"
    language: "it"
    flow: "fast"
    notes: "ICT business e policy Italia, fonte PR strategica"

  - name: "CIO Italia"
    feed_url: "https://www.cio.com/it/feed/"
    tier: 1
    category: "cio_target_it"
    language: "it"
    flow: "fast"
    notes: "Audience CTO/CIO italiana — target diretto del CEO Samir. NB: feed valido ma spesso bloccato dagli IP GitHub Actions"

  - name: "Agenda Digitale"
    feed_url: "https://www.agendadigitale.eu/feed/"
    tier: 1
    category: "policy_pa"
    language: "it"
    flow: "fast"
    notes: "Policy digitale, PNRR, PA — F3 trend + gare PA"

  - name: "Tom's Hardware Italia"
    feed_url: "https://www.tomshw.it/feed/"
    tier: 3
    category: "hardware_it"
    language: "it"
    flow: "fast"
    notes: "Hardware Italia (filtrare consumer con keyword pre-filtro)"

  # ════════════════════════════════════════════════════════════════
  # STORAGE / HPC / DATACENTER — specialisti internazionali
  # ════════════════════════════════════════════════════════════════
  # Cuore del know-how Mactronics: F1 (autorevolezza tecnica),
  # area_tech storage + hpc_ai + server_workstation.

  - name: "Blocks & Files"
    feed_url: "https://blocksandfiles.com/feed/"
    tier: 1
    category: "storage"
    language: "en"
    flow: "fast"
    notes: "Specialista storage enterprise, copertura DDN/Pure/NetApp/Infortrend"

  - name: "StorageReview"
    feed_url: "https://www.storagereview.com/feed"
    tier: 1
    category: "storage"
    language: "en"
    flow: "fast"
    notes: "Test/review storage hardware, vendor comparativi. 5 articoli in email"

  - name: "The Next Platform"
    feed_url: "https://www.nextplatform.com/feed/"
    tier: 1
    category: "hpc_server"
    language: "en"
    flow: "fast"
    notes: "HPC, server architecture, GPU computing — fonte chiave F1+F3"

  - name: "HPCwire"
    feed_url: "https://www.hpcwire.com/feed/"
    tier: 1
    category: "hpc"
    language: "en"
    flow: "fast"
    notes: "HPC mondiale, eventi ISC/SC, Top500. 8 articoli in email — 2ª fonte per resa"

  - name: "Top500 News"
    feed_url: "https://top500.org/news/feed/"
    tier: 1
    category: "hpc_benchmark"
    language: "en"
    flow: "slow"
    notes: "Lista Top500 supercomputing — bassa frequenza per natura, autorevolezza max"

  - name: "ServerTheHome"
    feed_url: "https://www.servethehome.com/feed/"
    tier: 1
    category: "server_hardware"
    language: "en"
    flow: "fast"
    notes: "Server hardware ultra-specialist (Supermicro/Gigabyte/AMD). Resa altissima: 6 email su 13 chiamate"

  - name: "The Register"
    feed_url: "https://www.theregister.com/headlines.atom"
    tier: 1
    category: "enterprise_it"
    language: "en"
    flow: "fast"
    notes: "IT enterprise news, ottimo per F3 (Broadcom, NVIDIA, AI policy)"

  # ════════════════════════════════════════════════════════════════
  # IT ENTERPRISE INTERNAZIONALE
  # ════════════════════════════════════════════════════════════════

  - name: "SiliconANGLE"
    feed_url: "https://siliconangle.com/feed/"
    tier: 1
    category: "enterprise_tech"
    language: "en"
    flow: "fast"
    notes: "Fonte n.1 per volume in email (13 articoli). Alto costo API ma alta resa"

  - name: "ITPro"
    feed_url: "https://www.itpro.com/feeds.xml"
    tier: 2
    category: "enterprise_it"
    language: "en"
    flow: "fast"
    notes: "IT pro UK, copertura broad enterprise"

  - name: "Network World"
    feed_url: "https://www.networkworld.com/feed/"
    tier: 2
    category: "networking"
    language: "en"
    flow: "fast"
    notes: "Networking, virtualizzazione, multi-cloud"

  - name: "IEEE Spectrum"
    feed_url: "https://spectrum.ieee.org/customfeeds/feed/all-topics/rss"
    tier: 2
    category: "ai_research"
    language: "en"
    flow: "fast"
    notes: "AI ricerca e ingegneria, autorevole per F3. Volume basso, costo trascurabile"

  # ════════════════════════════════════════════════════════════════
  # VENDOR PARTNER (Filone F4)
  # ════════════════════════════════════════════════════════════════
  # Blog ufficiali dei vendor in portfolio. Quando un partner annuncia
  # qualcosa, gancio ideale per co-content + portfolio_match bonus.

  - name: "NVIDIA Blog"
    feed_url: "https://blogs.nvidia.com/feed/"
    tier: 1
    category: "vendor_partner"
    language: "en"
    flow: "fast"
    notes: "Annunci NVIDIA: GPU, DGX, NIM, AI factory. Miglior score medio in assoluto (7.0)"

  - name: "VMware Blog"
    feed_url: "https://blogs.vmware.com/feed"
    tier: 1
    category: "vendor_partner"
    language: "en"
    flow: "fast"
    notes: "VMware/Broadcom: F3 trend caldo post-acquisizione"

  - name: "Red Hat Blog"
    feed_url: "https://www.redhat.com/en/rss/blog"
    tier: 1
    category: "vendor_partner"
    language: "en"
    flow: "fast"
    notes: "Red Hat: virtualizzazione enterprise (Open-E è partner Mactronics)"

  - name: "Western Digital Blog"
    feed_url: "https://blog.westerndigital.com/feed/"
    tier: 2
    category: "vendor_partner"
    language: "en"
    flow: "fast"
    notes: "WD corporate blog: HDD enterprise, storage trend. Volume bassissimo, costo nullo"


# ─── Configurazione globale ───

settings:
  # Cadenza bisettimanale (cron lun+gio):
  # • Lunedì copre ~96h (cattura weekend: ven→lun)
  # • Giovedì copre ~72h (lun→gio)
  max_age_hours_fast: 72
  max_age_hours_fast_monday: 96

  max_age_hours_slow: 168

  # Score minimo per entrare nell'email
  min_score: 5

  # Massimo articoli totali nell'email
  max_email_items: 12
